name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce English-only tracked content
        run: npm run check:english

      - name: Run unit tests
        run: npm test

      - name: Build the deterministic XPI
        run: npm run package

      - name: Verify the checksum
        run: cd dist && sha256sum -c *.xpi.sha256

      - name: Upload the packaged plugin
        uses: actions/upload-artifact@v7
        with:
          name: aitero-assistant-package
          path: |
            dist/*.xpi
            dist/*.xpi.sha256
          if-no-files-found: error
          compression-level: 0
